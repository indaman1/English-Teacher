<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#4f46e5" />
    <title>You are offline — English Teacher</title>
    <style>
      body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f8fafc;color:#0f172a;padding:24px;box-sizing:border-box}
      main{max-width:360px;text-align:center}
      .mark{width:72px;height:72px;border-radius:20px;margin:0 auto 20px;background:linear-gradient(135deg,#6366f1,#4338ca)}
      h1{font-size:22px;margin:0 0 8px}
      p{color:#475569;line-height:1.5;margin:0 0 20px}
      button{font:inherit;font-weight:600;background:#4f46e5;color:#fff;border:0;border-radius:12px;padding:12px 22px;cursor:pointer}
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true"></div>
      <h1>You are offline</h1>
      <p>Voice lessons need an internet connection to talk to your AI teacher. Check your connection and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
